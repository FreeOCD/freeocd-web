name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry-run: build and package on PRs that touch the release inputs; only a
  # tag push reaches the publish job.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/*.sh"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "vendor/**"
      - "public/**"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Validate – the tag must match package.json, point into main history, and
  # the production environment must still require approval for v* tags.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate tag and release policy
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag matches package.json and main
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/check-version.js
          version=$(node -p "require('./package.json').version")
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "label=v${version}-dryrun" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME must point to a commit in main history"
            exit 1
          fi
          echo "label=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify production requires approval and allows only v* tags
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate_release.sh

  # ---------------------------------------------------------------------------
  # Lint – same checks as CI to gate the release
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    needs: validate
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          package-manager-cache: false

      - name: Install dev dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: HTMLHint
        run: npm run lint:html

      - name: Validate target JSON
        run: npm run lint:json

      - name: Check static assets
        run: npm run lint:static

      - name: Unit tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Build – produce the deployable public/ directory
  # ---------------------------------------------------------------------------
  build:
    name: Build
    needs: [validate, lint]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          package-manager-cache: false

      - name: Install libusb-dev and libudev-dev
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev

      - name: Build DAP.js
        working-directory: vendor/dapjs
        run: |
          npm install
          npm run build

      - name: Copy build artifacts
        run: |
          mkdir -p public/lib
          cp vendor/dapjs/dist/dap.umd.js public/lib/dap.umd.js
          cp vendor/dapjs/LICENSE public/lib/dapjs-LICENSE.txt

      - name: Smoke-test DAP.js bundle and static assets
        run: |
          node scripts/smoke-dapjs.js
          node scripts/check-static.js --with-lib

      - name: Verify build artifacts
        run: |
          for f in public/lib/dap.umd.js public/lib/dapjs-LICENSE.txt; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 100 ]; then
              echo "::error::$f is suspiciously small (${size} bytes)"
              exit 1
            fi
            echo "✓ $(basename "$f") (${size} bytes)"
          done

      - name: Create release archive
        env:
          RELEASE_LABEL: ${{ needs.validate.outputs.label }}
        run: |
          cd public
          zip -r "../freeocd-web-${RELEASE_LABEL}.zip" .

      - name: Generate checksums
        run: |
          sha256sum freeocd-web-*.zip > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            freeocd-web-*.zip
            checksums-sha256.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish – create GitHub Release (least-privilege: write only here)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          digest-mismatch: error

      - name: List release files
        run: ls -la freeocd-web-*.zip checksums-sha256.txt

      - name: Verify checksums
        run: sha256sum -c checksums-sha256.txt

      - name: Recheck production policy and Release availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate_release.sh --publish-check

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: freeocd-web-*.zip

      - name: Create GitHub Release
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish_release.sh freeocd-web-*.zip checksums-sha256.txt

      - name: Release summary
        if: ${{ !cancelled() }}
        env:
          RELEASE_NAME: ${{ github.ref_name }}
          GITHUB_RELEASE_OUTCOME: ${{ steps.github-release.outcome }}
        run: |
          {
            echo "## Release ${RELEASE_NAME}"
            echo ""
            echo "GitHub Release: ${GITHUB_RELEASE_OUTCOME:-skipped}"
            echo ""
            echo "### Artifacts"
            echo '```'
            cat checksums-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
