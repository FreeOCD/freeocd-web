name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Lint – same checks as CI to gate the release
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          package-manager-cache: false

      - name: Install dev dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: HTMLHint
        run: npm run lint:html

      - name: Validate target JSON
        run: npm run lint:json

  # ---------------------------------------------------------------------------
  # Build – produce the deployable public/ directory
  # ---------------------------------------------------------------------------
  build:
    name: Build
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          package-manager-cache: false

      - name: Install libusb-dev and libudev-dev
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev

      - name: Build DAP.js
        working-directory: vendor/dapjs
        run: |
          npm install
          npm run build

      - name: Copy build artifacts
        run: |
          mkdir -p public/lib
          cp vendor/dapjs/dist/dap.umd.js public/lib/dap.umd.js
          cp vendor/dapjs/LICENSE public/lib/dapjs-LICENSE.txt

      - name: Verify build artifacts
        run: |
          for f in public/lib/dap.umd.js public/lib/dapjs-LICENSE.txt; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 100 ]; then
              echo "::error::$f is suspiciously small (${size} bytes)"
              exit 1
            fi
            echo "✓ $(basename "$f") (${size} bytes)"
          done

      - name: Create release archive
        run: |
          cd public
          zip -r "../freeocd-web-${GITHUB_REF_NAME}.zip" .

      - name: Generate checksums
        run: |
          sha256sum freeocd-web-*.zip > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            freeocd-web-*.zip
            checksums-sha256.txt

  # ---------------------------------------------------------------------------
  # Publish – create GitHub Release (least-privilege: write only here)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: List release files
        run: ls -la freeocd-web-*.zip checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        # zizmor: ignore[superfluous-actions] keeps gh-release for generated notes + file upload UX
        with:
          generate_release_notes: true
          files: |
            freeocd-web-*.zip
            checksums-sha256.txt

      - name: Release summary
        if: always()
        env:
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## Release ${RELEASE_NAME}"
            echo ""
            echo "### Artifacts"
            echo '```'
            cat checksums-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
